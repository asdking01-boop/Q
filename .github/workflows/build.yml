name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

            - name: Extract project ZIP
        run: |
          echo "Searching for ZIP..."
          find . -type f -iname "*.zip"

          ZIP=$(find . -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP NOT FOUND"
            exit 1
          fi

          mkdir -p project
          unzip "$ZIP" -d project
          echo "ZIP extracted successfully"

      - name: Build APK
        run: gradle -p project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASD-IPTV-Player-APK
          path: project/app/build/outputs/apk/debug/*.apk