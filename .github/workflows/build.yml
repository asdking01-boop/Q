name: Build Android APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract ZIP
        run: |
          ZIP=$(find . -type f -iname "*.zip" -not -path "./.git/*" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP file not found"
            find . -maxdepth 3 -type f
            exit 1
          fi

          mkdir -p project
          unzip "$ZIP" -d project

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASD-IPTV-Player-APK
          path: project/app/build/outputs/apk/debug/*.apk
